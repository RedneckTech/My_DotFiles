"$schema" = "https://starship.rs/config-schema.json"

add_newline = true

#[character]
#success_symbol = "[❯](bold green)"
#error_symbol = "[❯](bold red)"


format = """
$hostname
[SYSTEM::](bold green)$directory $zig $python$shell
[JOB::](bold yellow)$git_branch$git_status
$character
"""

[directory]
format = "[$path]($style)"
style = "bold cyan"

[python]
symbol = '👾 '
#pyenv_version_name = true

[zig]
symbol = '⚡️ '

[shell]
#bash_indicator = ''
#fish_indicator = '󰈺 '
#powershell_indicator = '_'
unknown_indicator = 'mystery shell'
style = 'purple bold'
disabled = false

[git_branch]
format = "[$branch]($style) "
style = "bold yellow"

[git_status]
ahead = '⇡${count}'
diverged = '⇕⇡${ahead_count}⇣${behind_count}'
behind = '⇣${count}'
staged = '[++\($count\)](green)'

[character]
success_symbol = "[READY>](bold green)"
error_symbol = "[ERROR>](bold red)"
vimcmd_symbol = "[COMMAND>](bold yellow)"

[hostname]
ssh_only = true
format = '[$ssh_symbol](bold blue) on [$hostname](bold red) '
trim_at = '.companyname.com'
disabled = false
