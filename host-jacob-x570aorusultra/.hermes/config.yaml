database:
  journal_mode: wal
runtime:
  nofile_soft_limit: 4096
model:
  default: opencode-go/deepseek-v4-pro
  provider: auto
  base_url: https://openrouter.ai/api/v1
kanban:
  review_dispatch: true
cron:
  catch_up_missed: true
terminal:
  backend: local
  cwd: .
  timeout: 180
  home_mode: auto
  docker_mount_cwd_to_workspace: false
  lifetime_seconds: 300
  container_cpu: 1
  container_memory: 5120
  container_disk: 51200
  container_persistent: true
browser:
  inactivity_timeout: 120
  extension_control:
    enabled: false
tool_loop_guardrails:
  warnings_enabled: true
  hard_stop_enabled: false
  non_interactive_hard_stop_enabled: true
  warn_after:
    exact_failure: 2
    same_tool_failure: 3
    idempotent_no_progress: 2
  hard_stop_after:
    exact_failure: 5
    same_tool_failure: 8
    idempotent_no_progress: 5
compression:
  enabled: true
  checkpoint_required: false
  progress_notices: false
  threshold: 0.5
  codex_gpt55_autoraise: true
  target_ratio: 0.2
  protect_last_n: 20
  min_tail_user_messages: 1
  max_attempts: 3
  codex_app_server_auto: native
  codex_responses_native: false
  codex_responses_compact_threshold:
  protect_first_n: 3
  idle_compact_after_seconds: 0
  hygiene_max_turn_hold_seconds: 10
  proactive_prune_tokens: 0
  proactive_prune_min_result_chars: 8000
  proactive_prune_min_reclaim_tokens: 4096
prompt_caching:
  cache_ttl: 5m
memory:
  memory_enabled: true
  user_profile_enabled: true
  memory_char_limit: 2200
  user_char_limit: 1375
  nudge_interval: 10
max_concurrent_sessions:
group_sessions_per_user: true
streaming:
  enabled: false
skills:
  creation_nudge_interval: 15
  create_dir: ~/.user_config/skills
  external_dirs:
    - ~/.user_config/skills
agent:
  max_turns: 500
  verbose: false
  reasoning_effort: medium
  service_tier: ''
  fast_auto_seconds: 60
  personalities: {}
gateway:
  signal_interrupt_grace_timeout: 1
  delivery_ledger: true
  platform_connect_timeout: 30
  loop_watchdog: true
  loop_watchdog_probe_interval_s: 30.0
  loop_watchdog_probe_timeout_s: 10.0
  loop_watchdog_max_strikes: 3
  allow_all_users: false
  bot_loop_guard:
    enabled: true
    max_events: 20
    window_seconds: 300
    cooldown_seconds: 600
  startup_watchdog: true
  startup_watchdog_timeout_seconds: 300
  write_sessions_json: true
  multiplex_profiles: true
  auto_multiplex_migration: true
  profile_routes: []
  scale_to_zero:
    idle_timeout_minutes: 2
  restart_loop_guard:
    max_restarts: 3
    window_seconds: 60
    max_gap_seconds: 300
  respawn_storm:
    max_starts: 5
    window_seconds: 120
  message_timestamps:
    enabled: false
  max_inbound_media_bytes: 134217728
  trust_env: true
  strict: false
  media_delivery_allow_dirs: []
  trust_recent_files: true
  trust_recent_files_seconds: 600
  api_server:
    max_concurrent_runs: 10
    history_tool_output_max_chars: 0
platform_toolsets:
  cli:
    - hermes-cli
  telegram:
    - hermes-telegram
  discord:
    - hermes-discord
  whatsapp:
    - hermes-whatsapp
  slack:
    - hermes-slack
  signal:
    - hermes-signal
  homeassistant:
    - hermes-homeassistant
  qqbot:
    - hermes-qqbot
  yuanbao:
    - hermes-yuanbao
  teams:
    - hermes-teams
  google_chat:
    - hermes-google_chat
stt:
  enabled: true
  local:
    model: base
  language: en
  openai:
    model: whisper-1
    language: ''
code_execution:
  timeout: 300
  max_tool_calls: 50
delegation:
  max_iterations: 250
display:
  compact: false
  tool_progress: all
  cleanup_progress: false
  interim_assistant_messages: true
  long_running_notifications: true
  busy_ack_detail: true
  busy_input_mode: interrupt
  background_process_notifications: concise
  bell_on_complete: false
  bell_on_prompt: false
  show_reasoning: false
  streaming: true
  skin: default
telemetry:
  shared_metrics:
    enabled: false
    send: false
    offer_version: 2
updates:
  check: true
  pre_update_backup: false
  backup_keep: 5
  non_interactive_local_changes: stash
onboarding:
  seen:
    tool_progress_prompt: true
    busy_input_prompt: true
approvals:
  destructive_slash_confirm: false
known_plugin_toolsets:
  acp:
    - homeassistant
  webhook:
    - homeassistant
_left_core_scoped:
  - homeassistant
plugins:
  enabled:
    - homeassistant
  disabled: []
_left_core_installed:
  - homeassistant
_config_version: 50
mcp_servers:
  filesystem:
    command: /home/jpfeiff/.local/bin/mcp-filesystem-server
    args:
      - /home/jpfeiff
      - /tmp
      - /media/jpfeiff
    enabled: true
  github:
    command: /home/jpfeiff/.local/bin/github-mcp-server
    args:
      - stdio
    env:
      GITHUB_PERSONAL_ACCESS_TOKEN: ${GITHUB_PERSONAL_ACCESS_TOKEN}
    enabled: true
  sequential-thinking:
    command: /home/jpfeiff/.local/bin/node
    args:
      - /home/jpfeiff/.local/lib/node_modules/@modelcontextprotocol/server-sequential-thinking/dist/index.js
    enabled: true
  markitdown:
    command: /home/jpfeiff/.local/bin/markitdown-mcp
    enabled: true
  globalping:
    url: https://mcp.globalping.dev/mcp
    auth: oauth
    enabled: true
    tools:
      exclude:
        - help
        - compareLocations
        - limits
  hugging_face:
    url: https://huggingface.co/mcp
    auth: oauth
    enabled: true
